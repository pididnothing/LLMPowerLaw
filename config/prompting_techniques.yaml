  - name: scaling_few_shot_cot_hellaswag
    type: custom
    description: "Few-shot CoT for HellaSwag"
    enabled: true
    template: |
      Choose the most plausible continuation. Show your reasoning.

      Context: A man is cooking pasta in a kitchen. He drains the noodles in the sink.
      Options:
      A: He throws the noodles on the floor.
      B: He mixes the noodles with sauce.
      C: He puts the noodles back in the package.
      D: He washes the noodles with soap.
      Reasoning: After draining pasta, the next logical cooking step is to add sauce. Throwing food on the floor, repackaging cooked noodles, or washing them with soap are all nonsensical. So the answer is B.
      Answer: B

      Context: A woman is planting flowers in her garden.
      Options:
      A: She waters the plants after placing them in the soil.
      B: She burns the flowers with a lighter.
      C: She throws the soil away.
      D: She eats the flowers immediately.
      Reasoning: Watering newly planted flowers is the standard next step in gardening. The other options are destructive or absurd actions that don't follow logically. So the answer is A.
      Answer: A

