      B: Albert Einstein
      C: Galileo Galilei
      D: Nikola Tesla
      Reasoning: The theory of relativity (both special and general) was developed by Albert Einstein. Newton formulated classical mechanics, Galileo contributed to observational astronomy, and Tesla was an electrical engineer. So the answer is B.
      Answer: B

      Question: What is the capital of Japan?
