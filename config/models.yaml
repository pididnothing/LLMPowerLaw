# Model Configuration
# Configure different LLM models for benchmarking
# Each model has: name, provider, configuration parameters

# ============================================================
# 🔧 HARDWARE-SPECIFIC RECOMMENDATIONS
# ============================================================
# For 4GB VRAM + 16GB RAM (your setup):
#   ✅ RECOMMENDED: tinyllama-local, gemma-2b-4bit, phi-3-mini-4bit
#   ✅ WORKS: llama-2-7b-4bit (tight, but should work)
#   ❌ TOO BIG: Any 8B+ model without 4-bit quantization
#
# For 8GB+ VRAM:
#   ✅ All 7B models with 4-bit quantization
#   ✅ 13B models with 4-bit (12GB+ recommended)
# ============================================================

models:
  # ============================================================
  # 🚀 QUICK TEST MODELS (For verification before full runs)
  # Start here! These load fast and let you verify setup
  # ============================================================
  
  # FASTEST: ~300MB, loads in <30 seconds (NOT for real experiments)
  - name: distilgpt2-test
    provider: huggingface_local
    model_id: distilgpt2
    max_tokens: 50
    temperature: 0.0
    device: auto
    load_in_8bit: false
    load_in_4bit: false
    torch_dtype: auto
    trust_remote_code: false
    local_model_path: null
    enabled: false  # Enable ONLY for testing your setup
    # Note: Not suitable for classification tasks, but great for testing
  
  # BEST FOR TESTING: 1.1B params, ~2GB download, good quality
  - name: tinyllama-test
    provider: huggingface_local
    model_id: TinyLlama/TinyLlama-1.1B-Chat-v1.0
    max_tokens: 256
    temperature: 0.0
    device: auto
    load_in_8bit: false
    load_in_4bit: false
    torch_dtype: auto
    trust_remote_code: false
    local_model_path: null
    enabled: false  # ✅ ENABLED - Perfect for your 4GB VRAM
    # Memory: ~1GB VRAM | Speed: Fast | Quality: Good for testing
  
  # ============================================================
  # 💎 RECOMMENDED FOR 4GB VRAM (Real Experiments)
  # ============================================================
  
  # Gemma 2B with 4-bit: Excellent quality, fits comfortably in 4GB
  - name: gemma-2b-4bit
    provider: huggingface_local
    model_id: google/gemma-2b-it
    max_tokens: 512
    temperature: 0.0
    device: auto
    load_in_8bit: false
    load_in_4bit: true  # 4-bit reduces to ~1GB VRAM
    torch_dtype: auto
    trust_remote_code: false
    local_model_path: null
    enabled: false  # ✅ ENABLED - Great for 4GB VRAM
    # Memory: ~1GB VRAM | Quality: Excellent for size
  
  # Phi-3-mini with 4-bit: Microsoft's efficient model
  - name: phi-3-mini-4bit
    provider: huggingface_local
    model_id: microsoft/Phi-3-mini-4k-instruct
    max_tokens: 512
    temperature: 0.0
    device: auto
    load_in_8bit: false
    load_in_4bit: true  # 4-bit reduces to ~2GB VRAM
    torch_dtype: auto
    trust_remote_code: true  # Required for Phi models
    local_model_path: null
    enabled: true  # ✅ ENABLED - Fits in 4GB VRAM
    # Memory: ~2GB VRAM | Quality: Very good
  
  # Llama 2 7B with 4-bit: More powerful, uses most of your VRAM
  - name: llama-2-7b-4bit
    provider: huggingface_local
    model_id: meta-llama/Llama-2-7b-chat-hf
    max_tokens: 512
    temperature: 0.0
    device: auto
    load_in_8bit: false
    load_in_4bit: true  # 4-bit reduces to ~4GB VRAM (tight!)
    torch_dtype: auto
    trust_remote_code: false
    local_model_path: null
    enabled: false  # Enable for better quality (uses all 4GB VRAM)
    # Memory: ~4GB VRAM (tight fit) | Quality: Excellent
    # Note: May need to close other GPU apps
  
  # ============================================================
  # 📐 SCALING LAW STUDY MODELS (For Colab T4 16GB VRAM)
  # All models are ungated, free, no API key needed.
  # Sorted by parameter count for scaling law plotting.
  # Models ≤3.8B run in fp16; 7B+ use 4-bit quantization.
  # ============================================================

  # --- 135M params ---
  - name: smollm-135m
    provider: huggingface_local
    model_id: HuggingFaceTB/SmolLM-135M-Instruct
    max_tokens: 512
    temperature: 0.0
    device: auto
    load_in_8bit: false
    load_in_4bit: false
    torch_dtype: auto
    trust_remote_code: false
    local_model_path: null
    enabled: false
    # Params: 0.135B | VRAM: ~0.3GB fp16 | Ungated

  # --- 360M params ---
  - name: smollm-360m
    provider: huggingface_local
    model_id: HuggingFaceTB/SmolLM-360M-Instruct
    max_tokens: 512
    temperature: 0.0
    device: auto
    load_in_8bit: false
    load_in_4bit: false
    torch_dtype: auto
    trust_remote_code: false
    local_model_path: null
    enabled: false
    # Params: 0.36B | VRAM: ~0.7GB fp16 | Ungated

  # --- 500M params ---
  - name: qwen2.5-0.5b
    provider: huggingface_local
    model_id: Qwen/Qwen2.5-0.5B-Instruct
    max_tokens: 512
    temperature: 0.0
    device: auto
    load_in_8bit: false
    load_in_4bit: false
    torch_dtype: auto
    trust_remote_code: true
    local_model_path: null
    enabled: false
    # Params: 0.5B | VRAM: ~1GB fp16 | Ungated (Apache 2.0)

  # --- 1.5B params ---
  - name: qwen2.5-1.5b
    provider: huggingface_local
    model_id: Qwen/Qwen2.5-1.5B-Instruct
    max_tokens: 512
    temperature: 0.0
    device: auto
    load_in_8bit: false
    load_in_4bit: false
    torch_dtype: auto
    trust_remote_code: true
    local_model_path: null
    enabled: false
    # Params: 1.5B | VRAM: ~3GB fp16 | Ungated (Apache 2.0)

  # --- 1.7B params ---
  - name: smollm-1.7b
    provider: huggingface_local
    model_id: HuggingFaceTB/SmolLM-1.7B-Instruct
    max_tokens: 512
    temperature: 0.0
    device: auto
    load_in_8bit: false
    load_in_4bit: false
    torch_dtype: auto
    trust_remote_code: false
    local_model_path: null
    enabled: false
    # Params: 1.7B | VRAM: ~3.4GB fp16 | Ungated (Apache 2.0)

  # --- 3B params ---
  - name: qwen2.5-3b
    provider: huggingface_local
    model_id: Qwen/Qwen2.5-3B-Instruct
    max_tokens: 512
    temperature: 0.0
    device: auto
    load_in_8bit: false
    load_in_4bit: false
    torch_dtype: auto
    trust_remote_code: true
    local_model_path: null
    enabled: false
    # Params: 3B | VRAM: ~6GB fp16 | Ungated (Apache 2.0)

  # --- 7.2B params (4-bit quantized) ---
  - name: mistral-7b-instruct
    provider: huggingface_local
    model_id: mistralai/Mistral-7B-Instruct-v0.3
    max_tokens: 512
    temperature: 0.0
    device: auto
    load_in_8bit: false
    load_in_4bit: true
    torch_dtype: auto
    trust_remote_code: false
    local_model_path: null
    enabled: false
    # Params: 7.2B | VRAM: ~4GB 4-bit | Ungated (Apache 2.0)

  # --- 7.6B params (4-bit quantized) ---
  - name: qwen2.5-7b
    provider: huggingface_local
    model_id: Qwen/Qwen2.5-7B-Instruct
    max_tokens: 512
    temperature: 0.0
    device: auto
    load_in_8bit: false
    load_in_4bit: true
    torch_dtype: auto
    trust_remote_code: true
    local_model_path: null
    enabled: false
    # Params: 7.6B | VRAM: ~4.5GB 4-bit | Ungated (Apache 2.0)

  # ============================================================
  # ⚠️  LARGER MODELS (Disabled - Require >4GB VRAM)
  # ============================================================
  # OpenAI Models
  - name: gpt-4
    provider: openai
    model_id: gpt-4
    max_tokens: 512
    temperature: 0.0
    enabled: false
    
  - name: gpt-3.5-turbo
    provider: openai
    model_id: gpt-3.5-turbo
    max_tokens: 512
    temperature: 0.0
    enabled: false
  
  # Anthropic Models
  - name: claude-3-opus
    provider: anthropic
    model_id: claude-3-opus-20240229
    max_tokens: 512
    temperature: 0.0
    enabled: false
    
  - name: claude-3-sonnet
    provider: anthropic
    model_id: claude-3-sonnet-20240229
    max_tokens: 512
    temperature: 0.0
    enabled: false
  
  # Open-source Models (HuggingFace) - LOCAL EXECUTION
  # These models run locally on your machine
  
  - name: llama-2-7b-local
    provider: huggingface_local
    model_id: meta-llama/Llama-2-7b-chat-hf
    max_tokens: 512
    temperature: 0.0
    device: auto
    load_in_8bit: false
    load_in_4bit: false  # Without quantization: ~14GB VRAM
    torch_dtype: auto
    trust_remote_code: false
    local_model_path: null
    enabled: false  # ❌ TOO BIG for 4GB VRAM without quantization
    
  - name: mistral-7b-local
    provider: huggingface_local
    model_id: mistralai/Mistral-7B-Instruct-v0.2
    max_tokens: 512
    temperature: 0.0
    device: auto
    load_in_8bit: false
    load_in_4bit: false  # Without quantization: ~14GB VRAM
    torch_dtype: auto
    trust_remote_code: false
    local_model_path: null
    enabled: false  # ❌ TOO BIG for 4GB VRAM without quantization
    
  - name: llama-3-8b-local
    provider: huggingface_local
    model_id: meta-llama/Meta-Llama-3-8B-Instruct
    max_tokens: 512
    temperature: 0.0
    device: auto
    load_in_8bit: false
    load_in_4bit: false  # Without quantization: ~16GB VRAM
    torch_dtype: auto
    trust_remote_code: false
    local_model_path: null
    enabled: false  # ❌ TOO BIG for 4GB VRAM without quantization
  
  - name: phi-3-mini-local
    provider: huggingface_local
    model_id: microsoft/Phi-3-mini-4k-instruct
    max_tokens: 512
    temperature: 0.0
    device: auto
    load_in_8bit: false
    load_in_4bit: true
    torch_dtype: auto
    trust_remote_code: true
    local_model_path: null
    enabled: false  # Duplicate of phi-3-mini-4bit above (kept for backwards compatibility)
  
  # ===== LARGER MODELS WITH MEMORY OPTIMIZATION =====
  # These models require quantization to run on consumer hardware
  # See MEMORY_OPTIMIZATION_GUIDE.md for details
  
  # Llama 2 13B with 4-bit quantization (~7GB VRAM)
  - name: llama-2-13b-4bit
    provider: huggingface_local
    model_id: meta-llama/Llama-2-13b-chat-hf
    max_tokens: 512
    temperature: 0.0
    device: auto
    load_in_8bit: false
    load_in_4bit: true  # Essential for 13B models
    torch_dtype: auto
    trust_remote_code: false
    local_model_path: null
    enabled: false
    # Expected: ~7GB VRAM, 2-3x slower than 7B models
  
  # Mixtral 8x7B with 4-bit quantization (~25GB VRAM)
  - name: mixtral-8x7b-4bit
    provider: huggingface_local
    model_id: mistralai/Mixtral-8x7B-Instruct-v0.1
    max_tokens: 512
    temperature: 0.0
    device: auto
    load_in_8bit: false
    load_in_4bit: true  # Required for MoE models
    torch_dtype: auto
    trust_remote_code: false
    local_model_path: null
    enabled: false
    # Expected: ~25GB VRAM, high-quality results
  
  # Llama 3 70B with 4-bit quantization (~35GB - CPU fallback)
  - name: llama-3-70b-4bit
    provider: huggingface_local
    model_id: meta-llama/Meta-Llama-3-70B-Instruct
    max_tokens: 256  # Reduced for speed
    temperature: 0.0
    device: auto  # Will use CPU+GPU offloading
    load_in_8bit: false
    load_in_4bit: true  # Mandatory for 70B models
    torch_dtype: auto
    trust_remote_code: false
    local_model_path: null
    enabled: false
    # Expected: ~35GB total RAM, VERY slow (0.5-2 tokens/sec)
    # Only for research/experiments where accuracy > speed
  
  # Qwen 14B with 4-bit quantization (~8GB VRAM)
  - name: qwen-14b-4bit
    provider: huggingface_local
    model_id: Qwen/Qwen-14B-Chat
    max_tokens: 512
    temperature: 0.0
    device: auto
    load_in_8bit: false
    load_in_4bit: true
    torch_dtype: auto
    trust_remote_code: true  # Qwen requires trust_remote_code
    local_model_path: null
    enabled: false
  
  # GGUF/Quantized Models (for llama.cpp or ctransformers)
  - name: llama-2-7b-gguf
    provider: gguf
    model_id: TheBloke/Llama-2-7B-Chat-GGUF
    model_file: llama-2-7b-chat.Q4_K_M.gguf  # Specific GGUF file
    max_tokens: 512
    temperature: 0.0
    n_ctx: 2048  # Context window
    n_gpu_layers: 0  # Number of layers to offload to GPU (0 = CPU only)
    local_model_path: null  # Optional: path to local GGUF file
    enabled: false
  
  # vLLM for high-performance local serving
  - name: llama-2-7b-vllm
    provider: vllm
    model_id: meta-llama/Llama-2-7b-chat-hf
    max_tokens: 512
    temperature: 0.0
    tensor_parallel_size: 1
    gpu_memory_utilization: 0.9
    local_model_path: null
    enabled: false
    
  # Google Models
  - name: gemini-pro
    provider: google
    model_id: gemini-pro
    max_tokens: 512
    temperature: 0.0
    enabled: false

# Global model settings
global_settings:
  default_batch_size: 8
  use_cache: true
  cache_dir: "./cache"
  max_retries: 3
  retry_delay: 2
  
  # Local model settings
  local_models:
    # Default device for local models
    default_device: auto  # auto, cuda, cpu, mps
    
    # Memory optimization
    enable_8bit_by_default: false
    enable_4bit_by_default: false
    
    # Model download/cache directory
    hf_cache_dir: null  # null uses HuggingFace default (~/.cache/huggingface)
    
    # Offline mode (use only cached models)
    offline_mode: false
    
    # GPU settings
    gpu_memory_fraction: 0.9  # Fraction of GPU memory to use
    max_memory: null  # Dict of max memory per device, e.g., {0: "10GiB", "cpu": "30GiB"}
    
    # Performance settings
    use_flash_attention: false  # Requires flash-attn library
    compile_model: false  # Use torch.compile for speedup (PyTorch 2.0+)
    
  # vLLM settings (for high-performance serving)
  vllm:
    enable: false
    host: "localhost"
    port: 8000
    
  # GGUF/llama.cpp settings
  gguf:
    enable: false
    n_threads: 4  # CPU threads for computation
    use_mlock: false  # Lock model in RAM
