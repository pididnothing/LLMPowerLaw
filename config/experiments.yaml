# Experiment Triplet Configuration
# Each experiment explicitly specifies: model, dataset, and prompting_technique
# This allows fine-grained control over which combinations to test

# Global experiment settings
global_settings:
  # If true, only run experiments with enabled=true
  run_only_enabled: true
  
  # Continue running other experiments if one fails
  continue_on_error: true
  
  # Maximum number of experiments to run (null = no limit)
  max_experiments: null
  
  # Default overrides (optional - can be overridden per experiment)
  default_num_samples: null  # Override dataset sample size (null = use dataset config)
  default_max_tokens: null   # Override model max_tokens (null = use model config)

# Experiment definitions - each is a model-dataset-template triplet
experiments:

  # ================================================================
  # EXISTING QUICK TEST EXPERIMENTS (keep for validation)
  # ================================================================
  - id: phi3_custom_simple
    model: phi-3-mini-4bit
    dataset: custom_classification_test
    prompting_technique: classification_simple_phi_3_mini
    description: "Phi-3 on custom sentiment with simple classification"
    enabled: false
    num_samples: 10
    max_tokens: 50
  
  - id: gemma_custom_simple
    model: gemma-2b-4bit
    dataset: custom_classification_test
    prompting_technique: classification_simple
    description: "Gemma on custom sentiment with simple classification"
    enabled: false
    num_samples: 10
    max_tokens: 50
  
  - id: tinyllama_custom_simple
    model: tinyllama-test
    dataset: custom_classification_test
    prompting_technique: classification_simple
    description: "TinyLlama on custom sentiment with simple classification"
    enabled: false
    num_samples: 10
    max_tokens: 50

  # ================================================================
  #  SCALING LAW EXPERIMENTS
  #  Organized by phase. Enable one phase at a time.
  #  Models (10): smollm-135m, smollm-360m, qwen2.5-0.5b,
  #    tinyllama-test, qwen2.5-1.5b, smollm-1.7b,
  #    qwen2.5-3b, phi-3-mini-4bit, mistral-7b-instruct, qwen2.5-7b
  #  Techniques (5): zero_shot, few_shot, cot, few_shot_cot, role_expert
  # ================================================================

  # ================================================================
  # PHASE 0 — SANITY CHECK (5 experiments)
  # Run the smallest model on SST-2 with each technique.
  # Verifies the full pipeline works end-to-end.
  # ================================================================
  - id: p0_smollm135m_sst2_zero
    model: smollm-135m
    dataset: sst2
    prompting_technique: sst2_zero_shot_smollm
    description: "Phase 0 sanity: SmolLM-135M SST-2 zero-shot"
    enabled: false
    num_samples: 20
    max_tokens: 10

  - id: p0_smollm135m_sst2_few
    model: smollm-135m
    dataset: sst2
    prompting_technique: sst2_few_shot_smollm
    description: "Phase 0 sanity: SmolLM-135M SST-2 few-shot"
    enabled: false
    num_samples: 20
    max_tokens: 10

  - id: p0_smollm135m_sst2_cot
    model: smollm-135m
    dataset: sst2
    prompting_technique: sst2_chain_of_thought_smollm
    description: "Phase 0 sanity: SmolLM-135M SST-2 CoT"
    enabled: false
    num_samples: 20
    max_tokens: 100

  - id: p0_smollm135m_sst2_fscot
    model: smollm-135m
    dataset: sst2
    prompting_technique: sst2_few_shot_cot_smollm
    description: "Phase 0 sanity: SmolLM-135M SST-2 few-shot-CoT"
    enabled: false
    num_samples: 20
    max_tokens: 100

  - id: p0_smollm135m_sst2_role
    model: smollm-135m
    dataset: sst2
    prompting_technique: sst2_role_expert_smollm
    description: "Phase 0 sanity: SmolLM-135M SST-2 role-expert"
    enabled: false
    num_samples: 20
    max_tokens: 10

  # ================================================================
  # PHASE 1 — SST-2 SENTIMENT (50 experiments)
  # Binary classification. All 10 models × 5 techniques.
  # This is the primary scaling law dataset (simplest task).
  # ================================================================

  # --- SmolLM-135M × SST-2 ---
  - {id: p1_smollm135m_sst2_zero, model: smollm-135m, dataset: sst2, prompting_technique: sst2_zero_shot_smollm, description: "SmolLM-135M SST-2 zero-shot", enabled: false, num_samples: 200, max_tokens: 10}
  - {id: p1_smollm135m_sst2_few, model: smollm-135m, dataset: sst2, prompting_technique: sst2_few_shot_smollm, description: "SmolLM-135M SST-2 few-shot", enabled: false, num_samples: 200, max_tokens: 10}
