  - {id: p1_smollm360m_sst2_cot, model: smollm-360m, dataset: sst2, prompting_technique: sst2_chain_of_thought_smollm, description: "SmolLM-360M SST-2 CoT", enabled: false, num_samples: 200, max_tokens: 150}
  - {id: p1_smollm360m_sst2_fscot, model: smollm-360m, dataset: sst2, prompting_technique: sst2_few_shot_cot_smollm, description: "SmolLM-360M SST-2 few-shot-CoT", enabled: false, num_samples: 200, max_tokens: 150}
  - {id: p1_smollm360m_sst2_role, model: smollm-360m, dataset: sst2, prompting_technique: sst2_role_expert_smollm, description: "SmolLM-360M SST-2 role-expert", enabled: false, num_samples: 200, max_tokens: 10}

