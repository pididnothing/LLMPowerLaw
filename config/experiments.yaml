  - {id: p1_qwen05b_sst2_fscot, model: qwen2.5-0.5b, dataset: sst2, prompting_technique: sst2_few_shot_cot_qwen2_5, description: "Qwen2.5-0.5B SST-2 few-shot-CoT", enabled: false, num_samples: 200, max_tokens: 150}
  - {id: p1_qwen05b_sst2_role, model: qwen2.5-0.5b, dataset: sst2, prompting_technique: sst2_role_expert_qwen2_5, description: "Qwen2.5-0.5B SST-2 role-expert", enabled: false, num_samples: 200, max_tokens: 10}

