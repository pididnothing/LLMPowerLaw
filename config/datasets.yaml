# Dataset Configuration
# Configure benchmarking datasets for evaluation
# Supports both built-in PromptBench datasets and custom datasets

# ============================================================
# 🧪 TEST RUN STRATEGY (Recommended workflow)
# ============================================================
# 1. START HERE: Enable test datasets (5-10 samples)
# 2. Run: python experiments/run_benchmark.py
# 3. Verify model loads and predictions work
# 4. THEN: Switch to full datasets (100-500 samples)
# 5. Run full experiments
# ============================================================

datasets:
  # ============================================================
  # 🧪 QUICK TEST DATASETS (5-10 samples for verification)
  # Enable these first to verify your setup works!
  # ============================================================
  
  # Test with custom classification (fastest - local file)
  - name: custom_classification_test
    type: custom
    file_path: "./data_loaders/data/custom_classification.jsonl"
    task_type: classification
    format: jsonl
    fields:
      text: "input"
      label: "label"
    num_samples: 5  # Just 5 samples for quick test
    enabled: true  # ✅ ENABLED - Quick test (completes in ~1 min)
    
  # Test with SST-2 sentiment classification
  - name: sst2_test
    type: huggingface
    dataset_name: glue
    subset: sst2
    split: validation
    task_type: classification
    num_samples: 10  # Just 10 samples for verification
    enabled: false  # Enable after custom test works
    fields:
      text: "sentence"
      label: "label"
    
  # ============================================================
  # � SCALING LAW BENCHMARK DATASETS
  # Standard benchmarks for scaling law study.
  # Enable per-phase as you work through experiments.
  # ============================================================

  # ARC-Challenge: Science reasoning, 4-way multiple choice
  - name: arc_challenge
    type: huggingface
    dataset_name: allenai/ai2_arc
    subset: ARC-Challenge
    split: test
    task_type: classification
    num_samples: 200
    enabled: false
    fields:
      text: "question"
      label: "answerKey"
      choices: "choices"

  # HellaSwag: Commonsense reasoning, 4-way completion
  - name: hellaswag
    type: huggingface
    dataset_name: Rowan/hellaswag
    subset: null
    split: validation
    task_type: classification
    num_samples: 200
    enabled: false
    fields:
      text: "ctx"
      label: "label"
      endings: "endings"

  # MMLU (subset): Broad knowledge, 4-way multiple choice
  - name: mmlu
    type: huggingface
    dataset_name: cais/mmlu
    subset: all
    split: test
    task_type: classification
    num_samples: 200
    enabled: false
    fields:
      text: "question"
      label: "answer"
      choices: "choices"

  # ============================================================
  # �📊 FULL EXPERIMENT DATASETS (100-500 samples)
  # Enable these after verifying with test datasets
  # ============================================================
  # ============================================================
  # 📊 FULL EXPERIMENT DATASETS (100-500 samples)
  # Enable these after verifying with test datasets
  # ============================================================
  
  # SST-2: Sentiment classification (full)
  - name: sst2
    type: huggingface
    dataset_name: glue
    subset: sst2
    split: validation
    task_type: classification
    num_samples: 100  # Start with 100, increase to 500 for final runs
    enabled: true  # ✅ ENABLED for testing
    fields:
      text: "sentence"
      label: "label"
    
  # MNLI: Natural language inference (full)
  - name: mnli
    type: huggingface
    dataset_name: glue
    subset: mnli
    split: validation_matched
    task_type: classification
    num_samples: 100  # Start with 100, increase to 500 for final runs
    enabled: false  # Enable after test runs work
    fields:
      text: "premise"  # Will need to concatenate with hypothesis
      label: "label"
    
  # QQP: Question pair matching (full)
  - name: qqp
    type: huggingface
    dataset_name: glue
    subset: qqp
    split: validation
    task_type: classification
    num_samples: 100  # Start with 100
    enabled: false
    fields:
      text: "question1"  # Will need to concatenate with question2
      label: "label"
  
  # Custom classification (full dataset)
  - name: custom_classification
    type: custom
    file_path: "./data_loaders/data/custom_classification.jsonl"
    task_type: classification
    format: jsonl
    fields:
      text: "input"
      label: "label"
    num_samples: null  # Use all available samples
    enabled: false  # Enable for full custom dataset runs
    
  - name: custom_qa
    type: custom
    file_path: "./data_loaders/data/custom_qa.csv"
    task_type: qa
    format: csv
    fields:
      question: "question"
      answer: "answer"
      context: "context"
    num_samples: null
    enabled: false
    
  - name: custom_generation
    type: custom
    file_path: "./data_loaders/data/custom_generation.json"
    task_type: generation
    format: json
    fields:
      prompt: "prompt"
      reference: "reference"
    num_samples: null
    enabled: false
  
  # HuggingFace datasets
  - name: squad
    type: huggingface
    dataset_name: squad
    subset: null
    split: validation
    task_type: qa
    num_samples: 10  # Minimal for quick testing
    enabled: false  # Disable for initial test
    
  - name: gsm8k
    type: huggingface
    dataset_name: gsm8k
    subset: main
    split: test
    task_type: reasoning
    num_samples: 10  # Minimal for quick testing
    enabled: false  # Disable for initial test

# Global dataset settings
global_settings:
  data_dir: "./data_loaders/data"
  cache_dir: "./cache/datasets"
  seed: 42
  shuffle: true
