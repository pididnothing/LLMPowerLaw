prompt_techniques:

  zero_shot:
    template: |
      Task: {{instruction}}

      Input:
      {{input}}

      Answer:


  few_shot:
    shots: 3
    template: |
      Task: {{instruction}}

      {% for example in examples %}
      Input: {{example.input}}
      Answer: {{example.answer}}

      {% endfor %}

      Now process the actual input below (not an example):
      Input: {{input}}
      Output ONLY one word label on the next line.
      Final Answer:


  chain_of_thought:
    template: |
      Task: {{instruction}}

      Question:
      {{input}}

      Let's think step by step. Give your reasoning in brief in one line 
      and then your final answer on the last line.

      Reasoning:


  few_shot_cot:
    shots: 3
    template: |
      Task: {{instruction}}

      {% for example in examples %}
      Question: {{example.input}}
      Reasoning: {{example.reasoning}}
      Answer: {{example.answer}}

      {% endfor %}

      Now solve the actual question below (not an example):
      Question: {{input}}
      Provide brief reasoning in one sentence.
      Reasoning:


  role_expert:
    template: |
      You are an expert in {{domain}}.

      Task: {{instruction}}

      Question:
      {{input}}

      Answer: